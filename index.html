<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Silos SPC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>SPC Control</h1>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="iniciarSesion()">Ingresar</button>
            <p id="login-msg" style="color:#ef4444; font-size:0.9rem; margin-top:15px; height:20px;"></p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-container" style="display:none; flex-direction:column; height:100vh;">
        
        <div class="global-header">
            <div style="font-weight:bold; color:var(--primary); font-size:1.2rem;">SPC Control</div>
            
            <div class="nav-tabs" id="nav-tabs">
                <button class="active" onclick="cambiarTab('tablero', this)">Tablero</button>
                <button onclick="cambiarTab('tanques', this)">Tanques</button>
                <button onclick="cambiarTab('canos', this)">Caños de Embarque</button>
                <button onclick="cambiarTab('existencias', this)">Existencias</button>
                <button onclick="cambiarTab('admin', this)" id="nav-admin" style="display:none;">Administración</button>
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <span id="user-display" style="font-size:0.85rem; font-weight:bold; color:var(--text-light);"></span>
                <button onclick="toggleDarkMode()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌙</button>
                <button onclick="cerrarSesion()" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">Salir</button>
            </div>
        </div>

        <div class="main-content">
            <!-- TABLERO -->
            <div id="tablero" class="tab-content active">
                <h2>Estado de Silos</h2>
                <div id="grid-tablero" class="grid-silos"></div>
            </div>

            <!-- TANQUES -->
            <div id="tanques" class="tab-content">
                <h2>Tanques</h2>
                <div id="grid-tanques" class="grid-silos"></div>
            </div>

            <!-- CAÑOS -->
            <div id="canos" class="tab-content">
                <h2>Unidades de Paso / Emergencia</h2>
                <p style="color:var(--text-light); font-size:0.9rem; margin-bottom:15px;">Solo CER y Caños de Embarque.</p>
                <div id="grid-canos" class="grid-silos"></div>
            </div>

            <!-- EXISTENCIAS -->
            <div id="existencias" class="tab-content">
                <h2>Stock por Cereal</h2>
                <div id="stock-container" style="background:var(--card); padding:20px; border-radius:8px; border:1px solid var(--border);"></div>
            </div>

            <!-- ADMINISTRACIÓN -->
            <div id="admin" class="tab-content">
                <h2>Administración de Usuarios</h2>
                <div class="admin-card">
                    <h3>Crear Nuevo Usuario</h3>
                    <div class="form-group">
                        <label>Nombre de Usuario (sin espacios)</label>
                        <input type="text" id="new-user-name" placeholder="Ej: operador1">
                    </div>
                    <div class="form-group">
                        <label>Contraseña Genérica</label>
                        <input type="text" id="new-user-pass" value="12345678">
                    </div>
                    <div class="form-group">
                        <label>Rol</label>
                        <select id="new-user-role">
                            <option value="OPERADOR">Operador</option>
                            <option value="LECTOR">Lector</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                    <button onclick="crearUsuario()" class="btn-save" style="background:#10b981;">Crear Usuario</button>
                    <p id="admin-msg" style="color:var(--primary); font-weight:bold; margin-top:10px;"></p>
                </div>
            </div>
        </div>

        <!-- PANEL LATERAL DE EDICIÓN -->
        <div id="slide-panel">
            <div class="panel-header">
                <h2 id="panel-title" style="margin:0; font-size:1.2rem;">Editar Unidad</h2>
                <button class="btn-close" onclick="cerrarPanel()">×</button>
            </div>
            <div class="panel-body">
                <input type="hidden" id="edit-id">
                <div id="panel-alerta" class="alert-box" style="display:none;"></div>

                <div class="form-group">
                    <label>Estado</label>
                    <select id="edit-estado" onchange="toggleCamposCarga()">
                        <option value="VACIO">Vacío</option>
                        <option value="CON_CARGA">Con Carga</option>
                        <option value="TAPADA">Tapado</option>
                        <option value="FUERA_SERVICIO">Fuera de Servicio</option>
                    </select>
                </div>

                <div id="campos-carga" style="display:none;">
                    <div class="form-group">
                        <label>Cereal</label>
                        <select id="edit-cereal"></select>
                    </div>
                    <div class="form-group">
                        <label>Calidad</label>
                        <input type="text" id="edit-calidad" placeholder="Ej: G2">
                    </div>
                    <div class="form-group">
                        <label>Origen</label>
                        <select id="edit-origen">
                            <option value="CAMIONES">Camiones</option>
                            <option value="VAGONES">Vagones</option>
                            <option value="TRANSILE">Transile</option>
                            <option value="TRANSFERENCIA">Transferencia (U6)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha de 1° Carga</label>
                        <input type="date" id="edit-fecha-carga">
                    </div>
                    <div class="form-group" id="group-metros">
                        <label>Metros de Vacío</label>
                        <input type="number" id="edit-metros" step="0.5" min="0" oninput="calcularTonelaje()">
                    </div>
                    
                    <!-- SECCIÓN SILOS 700 -->
                    <div id="seccion-700" style="display:none; background:var(--bg); padding:15px; border-radius:6px; border:1px solid var(--border); margin-bottom:15px;">
                        <p style="margin:0 0 10px 0; font-size:0.85rem; color:var(--primary); font-weight:bold;">Cálculo Manual (Silo 700)</p>
                        <div class="form-group">
                            <label>Tons Calculadas (Tabla)</label>
                            <input type="text" id="edit-tons-calc" readonly style="background:var(--border); color:var(--text-light);">
                        </div>
                        <div class="form-group">
                            <label>Tons Reales (Balanza)</label>
                            <input type="number" id="edit-tons-reales" min="0">
                        </div>
                        <div class="form-group">
                            <label>Espacio de Relleno (t)</label>
                            <input type="number" id="edit-tons-relleno" min="0">
                        </div>
                    </div>

                    <!-- SECCIÓN AUTOMÁTICA -->
                    <div id="seccion-auto" style="display:none;">
                        <div class="form-group">
                            <label>Tonelaje Calculado (Automático)</label>
                            <input type="number" id="edit-tons-auto" min="0" readonly style="background:var(--border);">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Fumigación</label>
                        <select id="edit-fumigacion-tipo">
                            <option value="NO">Sin fumigar</option>
                            <option value="TOTAL">Fumigación Completa</option>
                            <option value="PASTILLAS">Solo Pastillas</option>
                            <option value="LIQUIDO">Solo Líquido</option>
                        </select>
                    </div>
                    
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
                        <input type="checkbox" id="edit-alerta" style="width:20px; height:20px;" onchange="toggleAlertaMotivo()">
                        <label for="edit-alerta" style="margin:0; color:var(--danger); font-weight:bold;">Generar Alerta de Calidad</label>
                    </div>
                    <div class="form-group" id="group-alerta-motivo" style="display:none;">
                        <input type="text" id="edit-alerta-motivo" placeholder="Motivo de la alerta...">
                    </div>

                    <!-- RECIRCULACIÓN -->
                    <div style="background:var(--bg); padding:15px; border-radius:6px; border:1px solid var(--border); margin-top:20px; margin-bottom:15px;">
                        <p style="margin:0 0 10px 0; font-size:0.85rem; color:var(--primary); font-weight:bold;">Recirculación</p>
                        <div class="form-group">
                            <label>Motivo</label>
                            <select id="edit-recir-motivo">
                                <option value="">-- No recircular --</option>
                                <option value="FUMIGACION">Fumigación</option>
                                <option value="MUESTREO">Muestreo / Control</option>
                                <option value="TEMPERATURA">Bajar Temperatura</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha de Recirculación</label>
                            <input type="date" id="edit-recir-fecha">
                        </div>
                    </div>

                    <button onclick="guardarEdicion()" class="btn-save">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
